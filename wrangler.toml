# Wrangler configuration — SwapSpot Frontend (Cloudflare Pages)
# Deploy with: npx wrangler pages deploy site --project-name=swapspot
#
# Custom domain: swapspot.masurii.dev
# Docs: https://developers.cloudflare.com/pages/configuration/wrangler/

# This file is used for Pages project configuration reference.
# Actual deployment uses `wrangler pages deploy` which reads
# the project settings from the Cloudflare dashboard.
name = "swapspot"
compatibility_date = "2026-05-21"
pages_build_output_dir = "site"

# Custom domain configuration (set via dashboard or wrangler CLI):
# wrangler pages project create swapspot --production-branch main
# Then add custom domain in Cloudflare dashboard:
#   Pages > swapspot > Custom domains > swapspot.masurii.dev

[vars]
SITE_NAME = "SwapSpot"
SITE_DESCRIPTION = "Community-based item exchange and marketplace — Portfolio Case Study"

# ── Environment-specific overrides (optional) ──
[env.production]
# Production custom domain: swapspot.masurii.dev

[env.preview]
# Preview deployments get auto-generated *.pages.dev URLs
