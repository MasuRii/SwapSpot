name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify Render deployment artifacts
        run: |
          test -f render.yaml || (echo "render.yaml must be present for Render deployment" && exit 1)
          test -f build.sh    || (echo "build.sh must be present for Render deployment"    && exit 1)
          echo "Render deployment artifacts present and validated."
