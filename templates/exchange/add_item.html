{% extends 'exchange/base.html' %}
{% load static %}

{% block title %}Add Item - SwapSpot{% endblock %}

{% block content %}
<main class="add-item-page">
    <h1>Add Item</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit">Add Item</button>
    </form>
</main>
{% endblock %}
